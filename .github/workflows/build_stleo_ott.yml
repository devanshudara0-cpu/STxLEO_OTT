name: Build LEOVONIX Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Add Android Build Tools to PATH
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH
          echo "Using Android Build Tools from $BUILD_TOOLS_DIR"

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Stable Release APK
        run: ./gradlew assembleStableRelease --stacktrace

      - name: Sign & Align APK
        run: |
          BUILD_APK=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found built APK: $BUILD_APK"
          
          # Zipalign
          zipalign -v -p 4 "$BUILD_APK" LEOVONIX_v2.2_aligned.apk
          
          # Apksigner with Permanent LEOVONIX Keystore
          apksigner sign --ks app/leovonix_release.p12 \
            --ks-pass pass:leovonix123 \
            --ks-key-alias leovonix \
            --key-pass pass:leovonix123 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out LEOVONIX_v2.2.apk \
            LEOVONIX_v2.2_aligned.apk
            
          # Verify signature
          apksigner verify --verbose LEOVONIX_v2.2.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LEOVONIX_v2.2
          path: LEOVONIX_v2.2.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v2.2
          name: "LEOVONIX v2.2 Official Release"
          body: ""
          files: LEOVONIX_v2.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
