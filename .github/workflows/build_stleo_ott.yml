name: Build ST×LEO OTT Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Add Android Build Tools to PATH
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH
          echo "Using Android Build Tools from $BUILD_TOOLS_DIR"

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore app/release.keystore \
            -alias stleo -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass stleo123 -keypass stleo123 \
            -dname "CN=Devanshu, O=STxLEO, C=IN"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Stable Release APK
        run: ./gradlew assembleStableRelease --stacktrace

      - name: Sign & Align APK
        run: |
          BUILD_APK=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found built APK: $BUILD_APK"
          
          # Zipalign
          zipalign -v -p 4 "$BUILD_APK" STxLEO_OTT_v1.0_aligned.apk
          
          # Apksigner
          apksigner sign --ks app/release.keystore \
            --ks-pass pass:stleo123 \
            --ks-key-alias stleo \
            --key-pass pass:stleo123 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out STxLEO_OTT_v1.0.apk \
            STxLEO_OTT_v1.0_aligned.apk
            
          # Verify signature
          apksigner verify --verbose STxLEO_OTT_v1.0.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: STxLEO_OTT_v1.0
          path: STxLEO_OTT_v1.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0
          name: "ST×LEO OTT v1.0 Release"
          body: |
            ## ST×LEO OTT v1.0
            Official Release by Devanshu (@Dara_OG)
            
            - Built-in ST×LEO Official Providers
            - Clean Modern UI
            - High Performance ExoPlayer Engine
            - Multi-Language & 4K Streaming Support
          files: STxLEO_OTT_v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
